<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Google Translate TTS returns 404 when a Referer is sent (TODO-002) -->
    <meta name="referrer" content="no-referrer">
    <title>Claude Code 活用法 - プレゼン動画プレイヤー</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Noto Sans JP', 'sans-serif'],
                        mono: ['JetBrains Mono', 'monospace']
                    }
                }
            }
        }
    </script>

    <style>
        body {
            background-color: #020617;
            color: #f8fafc;
            font-family: 'Noto Sans JP', sans-serif;
            overflow-x: hidden;
        }

        /* 16:9 Slide Canvas Container with Container Queries */
        .video-viewport {
            aspect-ratio: 16 / 9;
            position: relative;
            background-color: #0f172a;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            container-type: inline-size;
            container-name: viewport;
        }

        /* タップ/クリックで再生と一時停止を切り替えたときの反応（TODO-005）。
           大きさは cqw で取る。スマホでは枠ごと --vp-scale で縮むので、
           px 直書きだと小さい画面で大きすぎる（TODO-001）。 */
        #tap-feedback-icon {
            font-size: clamp(28px, 9cqw, 96px);
            color: rgba(248, 250, 252, 0.9);
            text-shadow: 0 4px 24px rgba(2, 6, 23, 0.8);
            opacity: 0;
        }
        #tap-feedback-icon.is-shown {
            animation: tapFeedback 2s ease-out forwards;
        }

        /* 出したあと 1.5 秒はそのままで、最後の 0.5 秒で消す（TODO-006）。 */
        @keyframes tapFeedback {
            0% { opacity: 0.9; transform: scale(0.8); }
            10% { opacity: 0.9; transform: scale(1); }
            75% { opacity: 0.9; transform: scale(1); }
            100% { opacity: 0; transform: scale(1.3); }
        }

        /* Custom Scrollbar for sidebar */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #0f172a;
        }
        ::-webkit-scrollbar-thumb {
            background: #334155;
            border-radius: 3px;
        }

        /* Slide Transition Effects */
        .slide-fade-enter {
            animation: fadeIn 0.35s ease-out forwards;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.98); }
            to { opacity: 1; transform: scale(1); }
        }

        /* Audio Wave Visualizer Animation */
        .wave-bar {
            width: 3px;
            background-color: #bef264;
            border-radius: 2px;
            animation: wave 1.2s ease-in-out infinite alternate;
        }
        .wave-bar:nth-child(1) { height: 40%; animation-delay: 0.1s; }
        .wave-bar:nth-child(2) { height: 85%; animation-delay: 0.3s; }
        .wave-bar:nth-child(3) { height: 60%; animation-delay: 0.2s; }
        .wave-bar:nth-child(4) { height: 100%; animation-delay: 0.4s; }
        .wave-bar:nth-child(5) { height: 50%; animation-delay: 0.15s; }

        @keyframes wave {
            0% { transform: scaleY(0.3); }
            100% { transform: scaleY(1.1); }
        }

        .paused .wave-bar {
            animation-play-state: paused;
            transform: scaleY(0.2);
        }

        /* Pseudo Fullscreen Overlay Fallback - Fixed 16:9 Ratio Centered */
        /* 画面中央の 16:9 レターボックスはこのラッパーが担う。中身も字幕も
           この箱を基準に置けるので、100dvh からレターボックスの位置を
           計算する必要が無い（TODO-001）。
           高さは dvh で取る。スマホの 100vh は URL バーを含んだ高さなので、
           横持ち（幅 768 以上で PC 側の経路に入る）で 16:9 の箱が画面の下へ
           はみ出す（TODO-004）。dvh 非対応のブラウザ用に vh の行を先に置く。 */
        #viewport-stage.is-fullscreen {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            width: 100vw;
            height: 100vh;
            height: 100dvh;
            max-width: calc(100vh * (16 / 9));
            max-width: calc(100dvh * (16 / 9));
            max-height: calc(100vw * (9 / 16));
            margin: auto;
            z-index: 9999;
        }

        .video-viewport.pseudo-fullscreen {
            position: absolute !important;
            top: 0 !important;
            left: 0 !important;
            right: 0 !important;
            bottom: 0 !important;
            width: 100% !important;
            height: 100% !important;
            max-width: none !important;
            max-height: none !important;
            margin: 0 !important;
            border-radius: 0 !important;
            box-shadow: 0 0 80px rgba(0, 0, 0, 0.95) !important;
            padding: 1.5rem !important;
        }

        /* 16:9 の外枠と字幕バナーの土台。字幕は縮小の影響を受けないよう枠の
           外に置いてあるので、PC で枠に重ねる基準はこのラッパーが持つ。 */
        #viewport-stage {
            position: relative;
        }

        /* 字幕は #player-viewport の外に出したので、基準の箱がボーダーの分
           1px 広がる。その分を margin で戻し、枠内の位置を変更前と揃える。 */
        #subtitle-banner {
            margin: 1px;
        }

        /* 16:9 の外枠（#viewport-frame）は、マウスの PC では素通し。
           ブロック要素のまま幅いっぱいに広がるので、ここでの指定は要らない。
           狭い画面とタッチ画面でだけ、下の @media が縮小の土台にする。 */

        /* Mobile: 中身は PC と同じ 960x540 のまま描き、全体を transform で
           縮小する。cqw と clamp() は常に 960px 基準で解決されるので、
           スライド本文は PC と同じ組み方のまま小さくなる。ただし枠の中の
           固定 px のクロームは、768px 未満で md: が効かない分（text-xs 等の
           小さい方）がさらに縮むので、PC の見た目と同じ比率にはならない。
           幅の境界は Tailwind の md: に合わせた。
           タッチ画面にも掛けるのは、横持ちのスマホ（844x390 など）が幅 768 以上で
           PC 扱いになるため（TODO-009）。フルスクリーンの箱はレターボックスで
           960x540 より小さいので、縮小しないと clamp() の下限 px が効いて本文が
           縮まなくなり、枠内の上段（SLIDE 01 / 17 の行）に重なる。 */
        @media screen and (max-width: 767.98px), screen and (pointer: coarse) {
            #viewport-frame {
                position: relative;
                aspect-ratio: 16 / 9;
                /* 横持ちのスマホ（844x390 など）では、幅いっぱいに広げると
                   16:9 の高さが画面に収まらない。高さの上限は JS
                   （setupViewportScale）が枠の上端の実測から max-width として
                   入れる。ヘッダーの高さは幅で変わり、640〜712px の帯では
                   折り返して伸びるので、CSS に定数で書くとその帯でずれる
                   （TODO-011）。max-width が入ったときに枠を中央へ置くため、
                   margin-inline だけここに置く。 */
                margin-inline: auto;
                /* --vp-scale を入れる JS が動かなかったときでも、960px の
                   中身を枠内に閉じ込めるための保険。マウスの PC では
                   overflow を触らない（.video-viewport の影が枠で
                   切られてしまうため）。 */
                overflow: hidden;
            }
            /* 字幕は枠の外なので縮小されない。重ねると縮んだ中身を隠すため、
               枠の下へ流す。 */
            #subtitle-banner {
                position: static;
                margin: 0.75rem 0 0;
            }
            /* 擬似フルスクリーン中も同じく枠の下。ラッパーがレターボックス
               そのものなので、top: 100% がそのまま枠の下端になる（暗幕の上）。
               #player-viewport のボーダーを打ち消す 1px はここでは要らない。 */
            #viewport-stage.is-fullscreen > #subtitle-banner {
                position: absolute;
                top: 100%;
                /* Tailwind の bottom-3 が残ると top と挟まれて高さが潰れる */
                bottom: auto;
                left: 0;
                right: 0;
                margin: 0.75rem 0 0;
            }
            /* Tailwind の relative / p-4 に勝つよう id セレクタで書く */
            #player-viewport {
                position: absolute;
                top: 0;
                left: 0;
                width: 960px;
                height: 540px;
                max-width: none;
                padding: 1.5rem;
                transform: scale(var(--vp-scale, 1));
                transform-origin: top left;
            }
            /* ラッパーが fixed のレターボックスになり、外枠（#viewport-frame）は
               その中で 16:9 のまま。中身は 960x540 を --vp-scale で縮めた
               ものを据え置く。クラスは JS が付ける（:has() を使うと非対応
               ブラウザでルールごと落ちて無反応になる。TODO-001）。 */
            .video-viewport.pseudo-fullscreen {
                right: auto !important;
                bottom: auto !important;
                width: 960px !important;
                height: 540px !important;
                z-index: 1 !important;
            }

            /* 暗幕と裏のスクロール止めも同じ条件。
               フルスクリーン中のボタンは箱の裏で押せず、物理キーボードも
               無いので、暗幕が出ないと再読み込みしか出口が無くなる（TODO-003）。
               マウスの PC には掛けない。PC で裏をスクロール禁止にするとスクロール
               バーが消え、裏のページとレターボックスが横に動く（TODO-003）。
               なお暗幕の帯は画面の比率で決まり、16:9 ちょうどの画面では 0px に
               なる。そこでは抜けられないままだが、対応しないと決めた（TODO-003）。 */
            /* 擬似フルスクリーン中は裏のページをスクロールさせない。 */
            body.fs-lock {
                overflow: hidden;
            }
            /* レターボックスの余白に暗幕を敷く。box-shadow だとヒットテストの
               対象にならず、裏のヘッダーやチャプター一覧にタップが当たって
               しまうので、実体のある要素にしている。
               タップでフルスクリーンを抜ける（ハンドラは JS 側）。 */
            #viewport-stage.is-fullscreen::before {
                content: '';
                position: fixed;
                top: 0;
                left: 0;
                right: 0;
                bottom: 0;
                background: rgba(2, 6, 23, 0.92);
                touch-action: none;
                z-index: -1;
            }
        }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between">

    <!-- Top Header -->

            </div>

        <div class="flex items-center gap-3 flex-shrink-0">

                <span class="hidden sm:inline text-slate-300 font-medium">音声エンジン:</span>
                <span id="speech-status-indicator" class="text-sky-400 font-bold font-mono">Online Voice</span>
                <span class="hidden sm:inline text-[10px] bg-slate-950 text-sky-400 px-1.5 py-0.5 rounded border border-slate-800">切替</span>
            </button>

    <!-- Main Content Area -->
    <main class="max-w-7xl w-full mx-auto p-4 md:p-6 flex-grow flex flex-col gap-4">
        
        <div class="grid grid-cols-1 lg:grid-cols-4 gap-6 items-start">
            
            <!-- Video Player Column (3 Cols) -->
            <div class="lg:col-span-3 flex flex-col gap-3">
                
                <!-- Viewport Stage: 16:9 の外枠と、縮小の影響を受けない字幕バナーを並べる -->
                <div id="viewport-stage">
                    <!-- Viewport Container (16:9 の外枠。スマホではこの中で縮小する) -->
                    <div id="viewport-frame">
                        <div class="video-viewport border border-slate-800 flex flex-col justify-between p-4 md:p-6 relative select-none" id="player-viewport">

                            <!-- Background Glow Overlay -->
                            <div class="absolute -top-24 -right-24 w-80 h-80 bg-sky-500/10 rounded-full blur-3xl pointer-events-none"></div>
                            <div class="absolute -bottom-24 -left-24 w-80 h-80 bg-lime-500/10 rounded-full blur-3xl pointer-events-none"></div>

                            <!-- Top Slide Header Info -->
                            <div class="flex items-center justify-between text-sm md:text-base font-mono text-slate-400 z-10 mb-1 flex-shrink-0">
                                <div class="flex items-center gap-2">
                                    <span class="w-2.5 h-2.5 rounded-full bg-lime-400 animate-pulse"></span>

                                </div>
                                <div class="bg-slate-800/80 px-3 py-1 rounded text-slate-300 border border-slate-700/50">
                                    SLIDE <span id="slide-num" class="text-lime-400 font-bold">01</span> / <span id="total-slides">17</span>
                                </div>
                            </div>

                            <!-- Slide Canvas Main Body (Dynamic Injection) -->
                            <div id="slide-canvas" class="flex-grow z-10 slide-fade-enter overflow-hidden flex flex-col justify-center my-auto py-1">
                                <!-- Dynamic slide content will be rendered here -->
                            </div>

                            <!-- タップ/クリックで切り替えたときだけ一瞬出る ▶ / ‖（TODO-005）。
                                 枠のクリックを塞がないよう pointer-events-none。 -->
                            <div class="absolute inset-0 z-20 flex items-center justify-center pointer-events-none">
                                <i id="tap-feedback-icon" class="fa-solid fa-play"></i>
                            </div>

                        </div>
                    </div>

                    <!-- Bottom Subtitle / Narration Banner。
                         縮小の対象は #viewport-frame の中だけなので、字幕はその外に

                         PC では枠に重なり、768px 未満では枠の下へ流れる。 -->
                    <div id="subtitle-banner" class="z-30 bg-slate-950/95 backdrop-blur border border-sky-500/40 rounded-xl p-3 shadow-2xl flex items-center gap-3 absolute bottom-3 left-4 right-4 hidden">
                        <div class="flex items-center gap-1 h-6 md:h-7 px-2 bg-slate-900 rounded border border-slate-800 flex-shrink-0 paused" id="wave-container">
                            <div class="wave-bar"></div>
                            <div class="wave-bar"></div>
                            <div class="wave-bar"></div>
                            <div class="wave-bar"></div>
                            <div class="wave-bar"></div>
                        </div>
                        <div class="flex-grow min-w-0">
                            <div class="text-xs text-sky-400 font-bold uppercase tracking-wider flex items-center justify-between mb-1">
                                <span class="flex items-center gap-1"><i class="fa-solid fa-comment-dots"></i> ナレーション字幕</span>
                                <span id="audio-status-badge" class="text-xs bg-slate-800 text-slate-400 border border-slate-700 px-2 py-0.5 rounded font-mono">停止中</span>

                                <i class="fa-solid fa-play ml-0.5" id="play-icon"></i>
                            </button>

                            <!-- Next Slide Button -->

                                <i class="fa-solid fa-forward-step"></i>
                            </button>

                            <!-- Auto-Replay Toggle -->
                            <button id="restart-btn" class="ml-2 text-slate-400 hover:text-slate-200 text-xs flex items-center gap-1 bg-slate-800/50 hover:bg-slate-800 px-3 py-2 rounded-lg border border-slate-800">
                                <i class="fa-solid fa-rotate-left"></i> 最初から
                            </button>
                        </div>

                        <!-- Slide Title Preview -->
                        <div class="hidden md:flex flex-col text-center">
                            <span class="text-[10px] text-slate-400 uppercase tracking-widest">再生中スライド</span>
                            <span id="control-title-preview" class="text-xs font-bold text-lime-400 truncate max-w-[220px]">1. タイトル</span>
                        </div>

                        <!-- Right Options -->

                            <!-- Subtitle / Caption Toggle Button -->

                                <i class="fa-solid fa-closed-captioning" id="caption-icon"></i>

    <script>
        const slideData = [
            // Slide 1
            {
                id: 1,
                category: 'CLAUDE CODE WORKFLOW',

                    speakChunk(0);

                    // Safety timeout in case SpeechSynthesis hangs without firing onend
                    const safetyTime = Math.max(6000, (textToSpeak.length / 4.5 / getEffectiveSpeed()) * 1000 + 3000);
                    slideTransitionTimeout = setTimeout(() => {
                        if (!finished && isPlaying && runId === speechRunId) {
                            console.warn("Safety timeout triggered for speech end");
                            handleEnd();
                        }
                    }, safetyTime);

                }, 50);
            } else {
                speakOnlineTTS(textToSpeak);
            }
        }

        function speakOnlineTTS(text) {
            if (!text || isMuted || !isPlaying) return;
            updateWaveState(true, "朗読中 (Online Voice)");

            const cleanText = text.substring(0, 180);
            const ttsUrl = `https://translate.google.com/translate_tts?ie=UTF-8&tl=ja&client=tw-ob&q=${encodeURIComponent(cleanText)}`;

            if (!fallbackAudioElement) {
                // No play button press yet (autoplay will likely be blocked)
                fallbackAudioElement = new Audio();
            }
            fallbackAudioElement.pause();
            fallbackAudioElement.onended = null;
            fallbackAudioElement.onerror = null;
            fallbackAudioElement.src = ttsUrl;
            fallbackAudioElement.load();
            fallbackAudioElement.playbackRate = Math.min(2.0, getEffectiveSpeed());

            let finished = false;
            const handleEnd = () => {
                if (finished) return;
                finished = true;
                onSlideAudioFinished();
            };

            fallbackAudioElement.onended = () => {
                handleEnd();
            };

            fallbackAudioElement.onerror = (err) => {
                console.warn("Online Audio TTS error:", err);
                const muteWaitMs = (slideData[currentIndex].duration / getEffectiveSpeed()) * 1000;
                slideTransitionTimeout = setTimeout(handleEnd, muteWaitMs);
            };

            fallbackAudioElement.play().catch(e => {
                console.warn("Audio play blocked by browser interaction policy:", e);
                const muteWaitMs = (slideData[currentIndex].duration / getEffectiveSpeed()) * 1000;
                slideTransitionTimeout = setTimeout(handleEnd, muteWaitMs);
            });
        }

        function renderSlide(index, resetOffset = true) {
            if (index < 0 || index >= slideData.length) return;
            currentIndex = index;
            if (resetOffset) {
                currentSlideElapsedTime = 0;
            }
            const slide = slideData[currentIndex];

            // Render main slide HTML
            slideCanvas.classList.remove('slide-fade-enter');
            void slideCanvas.offsetWidth; // Reflow trigger
            slideCanvas.classList.add('slide-fade-enter');
            slideCanvas.innerHTML = slide.render();

            // Update UI headers & captions
            slideCategory.textContent = slide.category;
            slideNum.textContent = String(slide.id).padStart(2, '0');
            controlTitlePreview.textContent = `${slide.id}. ${slide.title}`;
            captionText.textContent = slide.narration;

            // Sync seek bar view
            updateProgressDisplay();

            // Sync sidebar list state
            updatePlaylistSelection();

            // Speak narration if currently active
            if (isPlaying) {
                speakCurrentNarration();
            }
        }

        function updateProgressDisplay() {
            const currentTotalSecs = Math.min(
                totalDurationSeconds,
                slideStartTimes[currentIndex] + currentSlideElapsedTime
            );
            const progressPct = Math.min(100, (currentTotalSecs / totalDurationSeconds) * 100);

            progressBar.style.width = `${progressPct}%`;
            progressThumb.style.left = `${progressPct}%`;
            currentTimeDisplay.textContent = formatTime(currentTotalSecs);
        }

        function updateWaveState(active, statusText) {
            waveContainer.classList.toggle('paused', !active);
            if (statusText) audioStatusBadge.textContent = statusText;
            audioStatusBadge.className = "text-[9px] bg-slate-800 border border-slate-700 px-1.5 py-0.5 rounded font-mono "
                + (active ? "text-lime-400 font-bold" : "text-slate-400");
        }

        function playbackLoop(timestamp) {
            if (!isPlaying) return;

            if (!lastFrameTimestamp) {
                lastFrameTimestamp = timestamp;
            }

            const deltaTime = (timestamp - lastFrameTimestamp) / 1000;
            lastFrameTimestamp = timestamp;

            // Advance time based on effective speed multiplier
            currentSlideElapsedTime += deltaTime * getEffectiveSpeed();

            // Cap elapsed time visually to slide duration until audio event triggers transition
            const currentSlide = slideData[currentIndex];
            if (currentSlideElapsedTime > currentSlide.duration) {
                currentSlideElapsedTime = currentSlide.duration;
            }

            updateProgressDisplay();

            animationFrameId = requestAnimationFrame(playbackLoop);
        }

        function playPresentation() {
            isPlaying = true;
            playIcon.classList.remove('fa-play', 'ml-0.5');
            playIcon.classList.add('fa-pause');
            
            lastFrameTimestamp = null;
            animationFrameId = requestAnimationFrame(playbackLoop);
            
            speakCurrentNarration();
        }

        function pausePresentation() {
            isPlaying = false;
            playIcon.classList.remove('fa-pause');
            playIcon.classList.add('fa-play', 'ml-0.5');
            
            if (animationFrameId) {
                cancelAnimationFrame(animationFrameId);
                animationFrameId = null;
            }
            
            stopSpeech();
            updateWaveState(false, "一時停止中");
        }

        function togglePlay() {
            if (isPlaying) {
                pausePresentation();
            } else {
                playPresentation();
            }
        }

        // チャプター一覧の項目。共通のクラスと、選択中かどうかで変わるクラスを分ける。
        const PLAYLIST_ITEM_CLASS = 'w-full text-left p-2.5 rounded-lg border transition flex items-center justify-between text-xs';
        const PLAYLIST_ITEM_ACTIVE_CLASSES = ['bg-sky-950/60', 'border-sky-500/50', 'text-sky-300', 'font-bold'];
        const PLAYLIST_ITEM_IDLE_CLASSES = ['bg-slate-800/40', 'border-slate-800', 'text-slate-400', 'hover:bg-slate-800', 'hover:text-slate-200'];
        const playlistItems = [];

        function setPlaylistItemState(item, active) {
            PLAYLIST_ITEM_ACTIVE_CLASSES.forEach(c => item.classList.toggle(c, active));
            PLAYLIST_ITEM_IDLE_CLASSES.forEach(c => item.classList.toggle(c, !active));
            item.querySelector('i').className = `fa-solid ${active ? 'fa-volume-high text-lime-400' : 'fa-chevron-right text-slate-600'} text-[10px]`;
        }

        function initPlaylist() {
            totalSlides.textContent = slideData.length;
            totalTimeDisplay.textContent = formatTime(totalDurationSeconds);

            slideData.forEach((slide, idx) => {
                const btn = document.createElement('button');
                btn.className = PLAYLIST_ITEM_CLASS;
                btn.innerHTML = `
                    <div class="flex items-center gap-2.5 truncate pr-2">
                        <span class="font-mono text-[10px] ${idx === currentIndex ? 'text-lime-400' : 'text-slate-500'}">${String(slide.id).padStart(2, '0')}</span>
                        <span class="truncate">${slide.title}</span>
                    </div>
                    <i></i>
                `;
                setPlaylistItemState(btn, idx === currentIndex);
                btn.onclick = () => {
                    renderSlide(idx, true);
                };
                playlistItems.push(btn);
                playlistItemsContainer.appendChild(btn);
            });
        }

        // 再生中の項目をチャプター一覧の中だけでスクロールさせる。
        // scrollIntoView() はスクロールできる祖先を全部動かすので、
        // 一覧が画面の外にあるスマホ縦画面ではページごとスクロールする（TODO-001）。
        function scrollPlaylistIntoView(item) {
            const box = playlistItemsContainer;
            // 画面上の位置の差で測る。offsetTop で書くと、一覧側に position が
            // 付いた途端に offsetParent が変わって静かに壊れる。
            const boxRect = box.getBoundingClientRect();
            const itemRect = item.getBoundingClientRect();
            const top = itemRect.top - boxRect.top + box.scrollTop;
            const bottom = top + itemRect.height;
            if (top < box.scrollTop) {
                box.scrollTo({ top: top, behavior: 'smooth' });
            } else if (bottom > box.scrollTop + box.clientHeight) {
                box.scrollTo({ top: bottom - box.clientHeight, behavior: 'smooth' });
            }
        }

        function updatePlaylistSelection() {
            playlistItems.forEach((item, idx) => {
                setPlaylistItemState(item, idx === currentIndex);
                if (idx === currentIndex) scrollPlaylistIntoView(item);
            });
        }

        function setupEventListeners() {
            playBtn.addEventListener('click', () => {
                // Direct user gesture unlock for Web Speech API in Chrome/Safari iFrames
                if ('speechSynthesis' in window) {
                    try {
                        window.speechSynthesis.resume();
                        const dummyUtterance = new SpeechSynthesisUtterance('');
                        dummyUtterance.volume = 0;
                        window.speechSynthesis.speak(dummyUtterance);
                    } catch(e) {}
                }
                unlockFallbackAudio();
                togglePlay();
            });

            // Toggle Subtitle Banner visibility
            toggleCaptionBtn.addEventListener('click', () => {
                showCaptions = !showCaptions;
                subtitleBanner.classList.toggle('hidden', !showCaptions);
                toggleCaptionBtn.classList.toggle('text-slate-400', !showCaptions);
                toggleCaptionBtn.classList.toggle('text-lime-400', showCaptions);
                toggleCaptionBtn.classList.toggle('border-lime-500/50', showCaptions);
                captionIcon.classList.toggle('text-slate-400', !showCaptions);
                captionIcon.classList.toggle('text-lime-400', showCaptions);
            });

            // Toggle Audio Engine Mode (Web Speech API <-> Online Voice)
            toggleVoiceEngineBtn.addEventListener('click', () => {
                voiceEngineMode = voiceEngineMode === 'speech' ? 'online' : 'speech';
                const online = voiceEngineMode === 'online';
                speechStatusIndicator.textContent = online ? "Online Voice" : "Web Speech API";
                speechStatusIndicator.className =
                    `${online ? 'text-sky-400' : 'text-lime-400'} font-bold font-mono`;
                if (isPlaying) {
                    speakCurrentNarration();
                }
            });

            prevBtn.addEventListener('click', () => {
                if (currentIndex > 0) {
                    renderSlide(currentIndex - 1, true);
                }
            });

            nextBtn.addEventListener('click', () => {
                if (currentIndex < slideData.length - 1) {
                    renderSlide(currentIndex + 1, true);
                }
            });

            restartBtn.addEventListener('click', () => {
                renderSlide(0, true);
                if (isPlaying) playPresentation();
            });

            // Speed multiplier options with 1.0x set as the new baseline (fast standard speed)
            const speedOptions = [0.75, 0.9, 1.0, 1.25, 1.5, 1.75, 2.0];
            speedBtn.addEventListener('click', () => {
                // indexOf が -1（一覧に無い値）でも先頭に戻る
                const nextIdx = (speedOptions.indexOf(playbackRate) + 1) % speedOptions.length;
                playbackRate = speedOptions[nextIdx];

                const label = Number.isInteger(playbackRate) ? `${playbackRate}.0x` : `${playbackRate}x`;
                speedBtn.textContent = label;
                if (isPlaying) {
                    speakCurrentNarration();
                }
            });

            muteBtn.addEventListener('click', () => {
                isMuted = !isMuted;
                if (isMuted) {
                    muteIcon.className = 'fa-solid fa-volume-xmark text-rose-400';
                    stopSpeech();
                    updateWaveState(false, "消音中");
                } else {
                    muteIcon.className = 'fa-solid fa-volume-high';
                    if (isPlaying) speakCurrentNarration();
                }
            });

            // スライドのクリック / タップで再生と一時停止を切り替える（TODO-005）。
            // フルスクリーン中のスマホは再生ボタンが暗幕の裏に入って押せず、
            // 物理キーボードも無いので Space も使えない。枠の中に押せるものは
            // 無いので、どこを押しても切り替えてよい。暗幕のハンドラは
            // #viewport-stage 自身の click なので、こことは当たらない。
            // 切り替えそのものは再生ボタンに投げる。枠タップが最初の操作に
            // なることがあるので、読み上げの解錠（unlockFallbackAudio）まで
            // 通す必要がある。ユーザー操作の中から同期で呼ぶので、Android
            // Chrome の自動再生ブロックにも掛からない（TODO-002）。
            const tapFeedbackIcon = document.getElementById('tap-feedback-icon');
            const playerViewport = document.getElementById('player-viewport');

            // 横スワイプでスライドを送る（TODO-010）。スマホでは前後ボタンが
            // 小さくしか出ないため。切り替えは prev-btn / next-btn に投げるので
            // 中身はボタンを押したときと同じ。縦スクロールを邪魔しないよう
            // preventDefault はせず、横の移動量が縦より大きいときだけ反応する。
            // 速さは見ない。時間で切ると、ゆっくり指を滑らせたときに
            // スワイプ扱いにならず、直後の click が再生／一時停止に化ける。
            // スワイプの後にも click が飛んでくることがあるので、フラグを立てて
            // 再生／一時停止（TODO-005）には通さない。フラグは次の touchstart で
            // 落とすので、click が来なくても次のタップに持ち越さない。
            const SWIPE_MIN_PX = 50;
            let touchStartX = 0;
            let touchStartY = 0;
            let touchStarted = false;
            let swiped = false;

            playerViewport.addEventListener('touchstart', (e) => {
                swiped = false;
                if (e.touches.length !== 1) {
                    touchStarted = false;
                    return;
                }
                touchStartX = e.touches[0].clientX;
                touchStartY = e.touches[0].clientY;
                touchStarted = true;
            }, { passive: true });

            playerViewport.addEventListener('touchend', (e) => {
                const touch = e.changedTouches[0];
                if (!touch || !touchStarted) return;
                const dx = touch.clientX - touchStartX;
                const dy = touch.clientY - touchStartY;
                touchStarted = false;
                if (Math.abs(dx) < SWIPE_MIN_PX || Math.abs(dx) <= Math.abs(dy)) return;
                swiped = true;
                (dx < 0 ? nextBtn : prevBtn).click();
            }, { passive: true });

            playerViewport.addEventListener('click', () => {
                if (swiped) {
                    swiped = false;
                    return;
                }
                playBtn.click();
                tapFeedbackIcon.className = `fa-solid ${isPlaying ? 'fa-play' : 'fa-pause'}`;
                // 連続でタップされても頭から出し直す
                void tapFeedbackIcon.offsetWidth;
                tapFeedbackIcon.classList.add('is-shown');
            });

            // 擬似フルスクリーンの入り切り。ラッパー側のクラスは CSS の
            // レターボックスと、狭い画面・タッチ画面の暗幕が使う。
            const stage = document.getElementById('viewport-stage');
            const setFullscreen = (on) => {
                playerViewport.classList.toggle('pseudo-fullscreen', on);
                stage.classList.toggle('is-fullscreen', on);
                document.body.classList.toggle('fs-lock', on);
                fullscreenBtn.querySelector('i').className = on ? 'fa-solid fa-compress' : 'fa-solid fa-expand';
            };

            fullscreenBtn.addEventListener('click', () => {
                setFullscreen(!playerViewport.classList.contains('pseudo-fullscreen'));
            });

            // 暗幕（#viewport-stage::before）のタップで抜ける。スマホでは
            // フルスクリーン中のボタンが暗幕に覆われ、Esc も押せないため。
            // 疑似要素のヒットはラッパー自身が受けるので、枠や字幕のタップ
            // （e.target が子要素）とはここで区別できる。
            stage.addEventListener('click', (e) => {
                if (e.target === stage && stage.classList.contains('is-fullscreen')) {
                    setFullscreen(false);
                }
            });

            // Listen for keyboard shortcuts (Space, Arrow keys, Fullscreen, Mute, Escape)
            document.addEventListener('keydown', (e) => {
                // Do not trigger shortcuts if focus is inside text inputs
                if (['INPUT', 'TEXTAREA'].includes(e.target.tagName)) return;

                if (e.key === ' ' || e.code === 'Space') {
                    e.preventDefault();
                    if ('speechSynthesis' in window) {
                        try {
                            window.speechSynthesis.resume();
                        } catch(err) {}
                    }
                    togglePlay();
                } else if (e.key === 'ArrowRight') {
                    e.preventDefault();
                    if (currentIndex < slideData.length - 1) {
                        renderSlide(currentIndex + 1, true);
                    }
                } else if (e.key === 'ArrowLeft') {
                    e.preventDefault();
                    if (currentIndex > 0) {
                        renderSlide(currentIndex - 1, true);
                    }
                } else if (e.key === 'f' || e.key === 'F') {
                    e.preventDefault();
                    fullscreenBtn.click();
                } else if (e.key === 'm' || e.key === 'M') {
                    e.preventDefault();
                    muteBtn.click();
                } else if (e.key === 'Escape') {
                    if (playerViewport.classList.contains('pseudo-fullscreen')) {
                        setFullscreen(false);
                    }
                }
            });

            // Seekbar click interaction
            document.getElementById('seekbar-container').addEventListener('click', (e) => {
                const rect = e.currentTarget.getBoundingClientRect();
                const clickX = e.clientX - rect.left;
                const ratio = Math.max(0, Math.min(1, clickX / rect.width));
                const targetSec = ratio * totalDurationSeconds;

                // 対象のスライドは「開始時刻が targetSec より前」の最後のもの。
                // スライドの境界ちょうどを指したときは手前のスライドの末尾になる
                // （手書きの累積ループと同じ）。0 秒のときだけ該当が無いので 0 に寄せる。
                const targetIndex = Math.max(0, slideStartTimes.findLastIndex(t => t < targetSec));

                currentSlideElapsedTime = targetSec - slideStartTimes[targetIndex];
                renderSlide(targetIndex, false);
            });
        }

        // Preload voices for Web Speech API
        if ('speechSynthesis' in window) {
            window.speechSynthesis.onvoiceschanged = () => {
                window.speechSynthesis.getVoices();
            };
        }

        // スマホ用: 外枠の幅に合わせて 960px 基準の縮小率を渡す。
        // --vp-scale を使うのは狭い画面とタッチ画面のメディアクエリの中だけなので、
        // マウスの PC では値が入っていても効かない。
        //
        // 通常表示では枠の高さの上限も入れる。横持ちのスマホは幅いっぱいに
        // 広げると 16:9 の高さが画面に収まらないので、画面の高さから枠の上端
        // （ヘッダーと本文の上余白）を引いた分を上限にし、幅の方を絞る
        // （TODO-011）。上端を実測するのは、ヘッダーの高さが幅で変わり、
        // 640〜712px の帯では折り返して伸びるため。
        // max-width はインラインで入るのでメディアクエリの外にも効いてしまう。
        // 同じ条件を CSS の @media にも書いてあるので、片方を変えたら
        // 両方直すこと。PC では空にする。
        // フルスクリーン中は枠自体がレターボックスで既に画面に収まっており、
        // 上限を重ねると二重に縮むので掛けない。
        function setupViewportScale() {
            const frame = document.getElementById('viewport-frame');
            const stage = document.getElementById('viewport-stage');
            if (!frame || !('ResizeObserver' in window)) return;
            const mobile = window.matchMedia(
                'screen and (max-width: 767.98px), screen and (pointer: coarse)');
            const update = () => {
                const capped = mobile.matches
                    && !(stage && stage.classList.contains('is-fullscreen'));
                // scrollY を足してページ内の位置に直す。getBoundingClientRect()
                // だけだとスクロール量の分だけ上限が伸び、枠が動いてしまう。
                frame.style.maxWidth = capped
                    ? Math.max(0, window.innerHeight
                        - (frame.getBoundingClientRect().top + window.scrollY))
                        * (16 / 9) + 'px'
                    : '';
                frame.style.setProperty(
                    '--vp-scale', frame.getBoundingClientRect().width / 960);
            };
            update();
            new ResizeObserver(update).observe(frame);
            window.addEventListener('resize', update);
            // フルスクリーンの出入りで上限の有無が変わる
            new MutationObserver(update).observe(
                stage, { attributes: true, attributeFilter: ['class'] });
        }

        function startApp() {
            setupViewportScale();
            initPlaylist();
            renderSlide(0, true);
            setupEventListeners();
        }

        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', startApp);
        } else {
            startApp();
        }
    </script>
</body>
</html>
